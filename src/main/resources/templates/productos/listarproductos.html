<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>El Tata Pizza | Listar Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-orange: #F15A22;
            --primary-hover: #D9480F;
            --cream-bg: #FFF8F3;
            --text-dark: #2B2B2B;
            --text-gray: #6B7280;
        }
        body {
            background-color: var(--cream-bg);
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .btn-primary-custom {
            background-color: var(--primary-orange);
            border-color: var(--primary-orange);
            color: white;
        }
        .btn-primary-custom:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            color: white;
        }
        .table-dark-custom {
            background-color: var(--primary-orange);
            color: white;
        }
        .page-title {
            color: var(--primary-orange);
            font-weight: 700;
        }
        .estado-habilitado {
            color: #28a745;
            font-weight: 600;
        }
        .estado-deshabilitado {
            color: #dc3545;
            font-weight: 600;
        }
         
        .btn-warning-custom {
            background-color: #f0ad4e;
            border-color: #f0ad4e;
            color: white;
        }
        .btn-warning-custom:hover {
            background-color: #ec971f;
            border-color: #ec971f;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h1 class="page-title">
            <i class="bi bi-box"></i> Listado de Productos
        </h1>
        <div class="mb-3">
            <a th:href="@{/productos/registro}" class="btn btn-primary-custom">
                <i class="bi bi-plus-circle"></i> Registrar Producto
            </a>
            <a th:href="@{/productos/habilita}" class="btn btn-warning-custom">
                <i class="bi bi-arrow-repeat"></i> Habilitar Producto
            </a>
            <a th:href="@{/menuprincipal}" class="btn btn-dark">
                <i class="bi bi-arrow-left"></i> Regresar
            </a>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered">
                <thead class="table-dark-custom">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nombre</th>
                        <th scope="col">Descripción</th>
                        <th scope="col">Categoría</th>
                        <th scope="col">Imagen</th>
                        <th scope="col">Apto Niños</th>
                        <th scope="col">Fecha Creación</th>
                        <th scope="col">Estado</th>
                        <th scope="col">Actualizar</th>
                        <th scope="col">Eliminar</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="prod : ${listarproductos}">
                        <th scope="row" th:text="${prod.id}"></th>
                        <td th:text="${prod.nombre}"></td>
                        <td th:text="${prod.descripcion}"></td>
                        <td th:text="${prod.categoria.nombre}"></td>
                        <td>
                            <span th:if="${prod.imagenUrl}" th:text="${prod.imagenUrl}"></span>
                            <span th:unless="${prod.imagenUrl}" class="text-muted">Sin imagen</span>
                        </td>
                        <td th:text="${prod.esAptoNinos} ? 'Sí' : 'No'"></td>
                        <td th:text="${prod.fechaCreacion}"></td>
                        <td>
                            <span th:if="${prod.estado}" class="estado-habilitado">
                                <i class="bi bi-check-circle-fill"></i> Habilitado
                            </span>
                            <span th:unless="${prod.estado}" class="estado-deshabilitado">
                                <i class="bi bi-x-circle-fill"></i> Deshabilitado
                            </span>
                        </td>
                        <td>
                            <a th:href="@{/productos/actualiza/{id}(id=${prod.id})}" class="btn btn-success btn-sm">
                                <i class="bi bi-pencil"></i> Editar
                            </a>
                        </td>
                        <td>
                            <a th:href="@{/productos/eliminar/{id}(id=${prod.id})}" 
                               class="btn btn-danger btn-sm"
                               th:classappend="${!prod.estado} ? 'disabled' : ''"
                               onclick="return confirm('¿Estás seguro de deshabilitar este producto?')">
                                <i class="bi bi-trash"></i> Deshabilitar
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
