<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>El Tata Pizza | Actualizar Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-orange: #F15A22;
            --primary-hover: #D9480F;
            --cream-bg: #FFF8F3;
            --text-dark: #2B2B2B;
            --text-gray: #6B7280;
        }
        body {
            background-color: var(--cream-bg);
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .btn-success-custom {
            background-color: #28a745;
            border-color: #28a745;
            color: white;
        }
        .btn-success-custom:hover {
            background-color: #218838;
            border-color: #218838;
            color: white;
        }
        .page-title {
            color: var(--primary-orange);
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h1 class="page-title">
            <i class="bi bi-pencil-square"></i> Actualización de Cliente
        </h1>
        <div class="mb-3"></div>
        
        <form th:action="@{/clientes/actualizar/{id}(id=*{id})}" method="post" th:object="${clientes}">
            
            <div class="row">
                <div class="col-2">
                    <label for="txtCod" class="form-label">ID:</label>
                    <input type="text" class="form-control" id="txtCod" name="txtCod"
                        readonly th:field="*{id}">
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-6">
                    <label for="txtNombres" class="form-label">Nombres:</label>
                    <input type="text" class="form-control" id="txtNombres" name="txtNombres"
                        placeholder="Ingresa los nombres" required th:field="*{nombres}">
                </div>

                <div class="col-6">
                    <label for="txtApellidos" class="form-label">Apellidos:</label>
                    <input type="text" class="form-control" id="txtApellidos" name="txtApellidos"
                        placeholder="Ingresa los apellidos" required th:field="*{apellidos}">
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-4">
                    <label for="txtTelefonoWhatsapp" class="form-label">Teléfono WhatsApp:</label>
                    <input type="text" class="form-control" id="txtTelefonoWhatsapp" name="txtTelefonoWhatsapp"
                        placeholder="Ej: 987654321" required th:field="*{telefonoWhatsapp}">
                </div>

                <div class="col-4">
                    <label for="txtCorreoElectronico" class="form-label">Correo Electrónico:</label>
                    <input type="email" class="form-control" id="txtCorreoElectronico" name="txtCorreoElectronico"
                        placeholder="cliente@email.com" th:field="*{correoElectronico}">
                </div>

                <div class="col-4">
                    <label for="txtPuntosFidelidad" class="form-label">Puntos de Fidelidad:</label>
                    <input type="number" class="form-control" id="txtPuntosFidelidad" name="txtPuntosFidelidad"
                        placeholder="0" th:field="*{puntosFidelidad}">
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-4">
                    <label for="txtTipoDocumento" class="form-label">Tipo de Documento:</label>
                    <select class="form-select" id="txtTipoDocumento" th:field="*{tipoDocumento}">
                        <option value="">Seleccione tipo</option>
                        <option value="DNI">DNI</option>
                        <option value="CE">Carné de Extranjería</option>
                        <option value="RUC">RUC</option>
                        <option value="PASAPORTE">Pasaporte</option>
                    </select>
                </div>

                <div class="col-4">
                    <label for="txtNumeroDocumento" class="form-label">Número de Documento:</label>
                    <input type="text" class="form-control" id="txtNumeroDocumento" name="txtNumeroDocumento"
                        placeholder="Ingresa el número" required th:field="*{numeroDocumento}">
                </div>

                <div class="col-4">
                    <label for="chkEst" class="form-label">Estado:</label>
                    <div class="form-check mt-2">
                        <input type="checkbox" class="form-check-input" id="chkEst" 
                               th:field="*{estado}">
                        <label class="form-check-label" for="chkEst">
                            Activo
                        </label>
                    </div>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-12">
                    <button type="submit" class="btn btn-success-custom">
                        <i class="bi bi-save"></i> Actualizar
                    </button>
                    <a th:href="@{/clientes/listar}" class="btn btn-dark">
                        <i class="bi bi-arrow-left"></i> Regresar
                    </a>
                </div>
            </div>

        </form>

        <!-- Después del formulario -->
        <div class="row mt-4">
            <div class="col-12">
                <a th:href="@{/direcciones/listarPorCliente/{id}(id=*{id})}" 
                class="btn btn-outline-primary">
                    <i class="bi bi-geo-alt"></i> Gestionar Direcciones de este Cliente
                </a>
            </div>
        </div>

        
    </div>


    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
