<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>El Tata Pizza | Listar Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-orange: #F15A22;
            --primary-hover: #D9480F;
            --cream-bg: #FFF8F3;
            --text-dark: #2B2B2B;
            --text-gray: #6B7280;
        }
        body {
            background-color: var(--cream-bg);
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .btn-primary-custom {
            background-color: var(--primary-orange);
            border-color: var(--primary-orange);
            color: white;
        }
        .btn-primary-custom:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            color: white;
        }
        .table-dark-custom {
            background-color: var(--primary-orange);
            color: white;
        }
        .page-title {
            color: var(--primary-orange);
            font-weight: 700;
        }
        .btn-warning-custom {
            background-color: #f0ad4e;
            border-color: #f0ad4e;
            color: white;
        }
        .btn-warning-custom:hover {
            background-color: #ec971f;
            border-color: #ec971f;
            color: white;
        }
        .estado-habilitado {
            color: #28a745;
            font-weight: 600;
        }
        .estado-deshabilitado {
            color: #dc3545;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h1 class="page-title">
            <i class="bi bi-people"></i> Listado de Clientes
        </h1>
        <div class="mb-3">
            <a th:href="@{/clientes/registro}" class="btn btn-primary-custom">
                <i class="bi bi-plus-circle"></i> Registrar Cliente
            </a>
            <a th:href="@{/clientes/habilita}" class="btn btn-warning-custom">
                <i class="bi bi-arrow-repeat"></i> Habilitar Cliente
            </a>
            <a th:href="@{/menuprincipal}" class="btn btn-dark">
                <i class="bi bi-arrow-left"></i> Regresar
            </a>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered">
                <thead class="table-dark-custom">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nombres</th>
                        <th scope="col">Apellidos</th>
                        <th scope="col">WhatsApp</th>
                        <th scope="col">Correo</th>
                        <th scope="col">Tipo Doc.</th>
                        <th scope="col">N° Documento</th>
                        <th scope="col">Puntos</th>
                        <th scope="col">Estado</th>
                        <th scope="col">Fecha Registro</th>
                        <th scope="col">Actualizar</th>
                        <th scope="col">Deshabilitar</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cli : ${listarclientes}">
                        <th scope="row" th:text="${cli.id}"></th>
                        <td th:text="${cli.nombres}"></td>
                        <td th:text="${cli.apellidos}"></td>
                        <td th:text="${cli.telefonoWhatsapp}"></td>
                        <td th:text="${cli.correoElectronico}"></td>
                        <td th:text="${cli.tipoDocumento}"></td>
                        <td th:text="${cli.numeroDocumento}"></td>
                        <td th:text="${cli.puntosFidelidad}"></td>
                        <td>
                            <span th:if="${cli.estado}" class="estado-habilitado">
                                <i class="bi bi-check-circle-fill"></i> Activo
                            </span>
                            <span th:unless="${cli.estado}" class="estado-deshabilitado">
                                <i class="bi bi-x-circle-fill"></i> Inactivo
                            </span>
                        </td>
                        <td th:text="${cli.fechaRegistro}"></td>
                        <td>
                            <a th:href="@{/clientes/actualiza/{id}(id=${cli.id})}" class="btn btn-success btn-sm">
                                <i class="bi bi-pencil"></i> Editar
                            </a>
                        </td>
                        <td>
                            <a th:href="@{/clientes/eliminar/{id}(id=${cli.id})}" 
                               class="btn btn-danger btn-sm"
                               th:classappend="${!cli.estado} ? 'disabled' : ''"
                               onclick="return confirm('¿Estás seguro de deshabilitar este cliente?')">
                                <i class="bi bi-trash"></i> Deshabilitar
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
