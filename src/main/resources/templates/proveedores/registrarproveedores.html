<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>El Tata Pizza | Registrar Proveedor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-orange: #F15A22;
            --primary-hover: #D9480F;
            --cream-bg: #FFF8F3;
            --text-dark: #2B2B2B;
            --text-gray: #6B7280;
        }
        body {
            background-color: var(--cream-bg);
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .btn-primary-custom {
            background-color: var(--primary-orange);
            border-color: var(--primary-orange);
            color: white;
        }
        .btn-primary-custom:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            color: white;
        }
        .page-title {
            color: var(--primary-orange);
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h1 class="page-title">
            <i class="bi bi-plus-circle"></i> Registro de Proveedor
        </h1>
        <div class="mb-3"></div>
        
        <form th:action="@{/proveedores/registrar}" method="post" th:object="${proveedor}">
            
            <div class="row">
                <div class="col-4">
                    <label for="txtRuc" class="form-label">RUC:</label>
                    <input type="text" class="form-control" id="txtRuc" name="txtRuc"
                        placeholder="Ingresa el RUC" required th:field="*{ruc}">
                </div>

                <div class="col-8">
                    <label for="txtRazonSocial" class="form-label">Razón Social:</label>
                    <input type="text" class="form-control" id="txtRazonSocial" name="txtRazonSocial"
                        placeholder="Ingresa la razón social" required th:field="*{razonSocial}">
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-6">
                    <label for="txtContactoNombre" class="form-label">Nombre de Contacto:</label>
                    <input type="text" class="form-control" id="txtContactoNombre" name="txtContactoNombre"
                        placeholder="Ingresa el nombre del contacto" required th:field="*{contactoNombre}">
                </div>

                <div class="col-6">
                    <label for="txtTelefono" class="form-label">Teléfono:</label>
                    <input type="text" class="form-control" id="txtTelefono" name="txtTelefono"
                        placeholder="Ingresa el teléfono" required th:field="*{telefono}">
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-6">
                    <label for="txtCorreoElectronico" class="form-label">Correo Electrónico:</label>
                    <input type="email" class="form-control" id="txtCorreoElectronico" name="txtCorreoElectronico"
                        placeholder="proveedor@email.com" th:field="*{correoElectronico}">
                </div>

                <div class="col-6">
                    <label for="chkEst" class="form-label">Estado:</label>
                    <div class="form-check mt-2">
                        <input type="checkbox" class="form-check-input" id="chkEst" 
                               th:field="*{estado}">
                        <label class="form-check-label" for="chkEst">
                            Activo
                        </label>
                    </div>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-12">
                    <button type="submit" class="btn btn-primary-custom">
                        <i class="bi bi-save"></i> Registrar
                    </button>
                    <a th:href="@{/proveedores/listar}" class="btn btn-dark">
                        <i class="bi bi-arrow-left"></i> Regresar
                    </a>
                </div>
            </div>

        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
