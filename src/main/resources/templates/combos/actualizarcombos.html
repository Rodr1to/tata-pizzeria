<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>El Tata Pizza | Actualizar Combo y Promoción</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-orange: #F15A22;
            --primary-hover: #D9480F;
            --cream-bg: #FFF8F3;
            --text-dark: #2B2B2B;
            --text-gray: #6B7280;
        }
        body {
            background-color: var(--cream-bg);
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .btn-success-custom {
            background-color: #28a745;
            border-color: #28a745;
            color: white;
        }
        .btn-success-custom:hover {
            background-color: #218838;
            border-color: #218838;
            color: white;
        }
        .page-title {
            color: var(--primary-orange);
            font-weight: 700;
        }
        /* Estilo para los inputs de fecha */
        input[type="date"] {
            cursor: pointer;
        }
        input[type="date"]:focus {
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 0.2rem rgba(241, 90, 34, 0.25);
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h1 class="page-title">
            <i class="bi bi-pencil-square"></i> Actualización de Combo y Promoción
        </h1>
        <div class="mb-3"></div>
        
        <form th:action="@{/combos/actualizar/{id}(id=*{id})}" method="post" th:object="${combos}">
            
            <div class="row">
                <div class="col-2">
                    <label for="txtCod" class="form-label">ID:</label>
                    <input type="text" class="form-control" id="txtCod" name="txtCod"
                        readonly th:field="*{id}">
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-6">
                    <label for="txtNombreCombo" class="form-label">Nombre del Combo:</label>
                    <input type="text" class="form-control" id="txtNombreCombo" name="txtNombreCombo"
                        placeholder="Ej: Combo Familiar, Promoción 2x1" required th:field="*{nombreCombo}">
                </div>

                <div class="col-6">
                    <label for="txtPrecioCombo" class="form-label">Precio del Combo:</label>
                    <input type="number" step="0.01" class="form-control" id="txtPrecioCombo" name="txtPrecioCombo"
                        placeholder="Ingresa el precio del combo" required th:field="*{precioCombo}">
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-12">
                    <label for="txtDescripcion" class="form-label">Descripción:</label>
                    <textarea class="form-control" id="txtDescripcion" rows="2" 
                              placeholder="Ingresa la descripción del combo"
                              required th:field="*{descripcion}"></textarea>
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-6">
                    <label for="txtFechaInicio" class="form-label">Fecha de Inicio:</label>
                    <input type="date" class="form-control" id="txtFechaInicio" name="txtFechaInicio"
                           th:field="*{fechaInicio}">
                </div>

                <div class="col-6">
                    <label for="txtFechaFin" class="form-label">Fecha de Fin:</label>
                    <input type="date" class="form-control" id="txtFechaFin" name="txtFechaFin"
                           th:field="*{fechaFin}">
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-6">
                    <label for="chkEst" class="form-label">Estado:</label>
                    <div class="form-check mt-2">
                        <input type="checkbox" class="form-check-input" id="chkEst" 
                               th:field="*{estado}">
                        <label class="form-check-label" for="chkEst">
                            Habilitado
                        </label>
                    </div>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-12">
                    <button type="submit" class="btn btn-success-custom">
                        <i class="bi bi-save"></i> Actualizar
                    </button>
                    <a th:href="@{/combos/listar}" class="btn btn-dark">
                        <i class="bi bi-arrow-left"></i> Regresar
                    </a>
                </div>
            </div>

        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
