<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>El Tata Pizza | Historial de Estados de Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-orange: #F15A22;
            --primary-hover: #D9480F;
            --cream-bg: #FFF8F3;
            --text-dark: #2B2B2B;
            --text-gray: #6B7280;
        }
        body {
            background-color: var(--cream-bg);
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .btn-primary-custom {
            background-color: var(--primary-orange);
            border-color: var(--primary-orange);
            color: white;
        }
        .btn-primary-custom:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            color: white;
        }
        .table-dark-custom {
            background-color: var(--primary-orange);
            color: white;
        }
        .page-title {
            color: var(--primary-orange);
            font-weight: 700;
        }
        .estado-pendiente {
            background-color: #f0ad4e;
            color: white;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
        }
        .estado-en-preparacion {
            background-color: #5bc0de;
            color: white;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
        }
        .estado-en-camino {
            background-color: #5bc0de;
            color: white;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
        }
        .estado-entregado {
            background-color: #28a745;
            color: white;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
        }
        .estado-cancelado {
            background-color: #dc3545;
            color: white;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
        }
        .badge-custom {
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .badge-pendiente {
            background-color: #f0ad4e;
            color: white;
        }
        .badge-en-preparacion {
            background-color: #5bc0de;
            color: white;
        }
        .badge-en-camino {
            background-color: #5bc0de;
            color: white;
        }
        .badge-entregado {
            background-color: #28a745;
            color: white;
        }
        .badge-cancelado {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h1 class="page-title">
            <i class="bi bi-clock-history"></i> Historial de Estados de Pedidos
        </h1>
        <div class="mb-3">
            <a th:href="@{/menuprincipal}" class="btn btn-dark">
                <i class="bi bi-arrow-left"></i> Regresar
            </a>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered">
                <thead class="table-dark-custom">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Pedido</th>
                        <th scope="col">Estado</th>
                        <th scope="col">Fecha y Hora</th>
                        <th scope="col">Usuario que Cambió</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="hist : ${listarhistorial}">
                        <th scope="row" th:text="${hist.id}"></th>
                        <td th:text="'#' + ${hist.pedido.id}"></td>
                        <td>
                            <span th:if="${hist.estado == 'PENDIENTE'}" class="badge-custom badge-pendiente">
                                <i class="bi bi-clock-fill"></i> Pendiente
                            </span>
                            <span th:if="${hist.estado == 'EN_PREPARACION'}" class="badge-custom badge-en-preparacion">
                                <i class="bi bi-arrow-repeat"></i> En Preparación
                            </span>
                            <span th:if="${hist.estado == 'EN_CAMINO'}" class="badge-custom badge-en-camino">
                                <i class="bi bi-truck"></i> En Camino
                            </span>
                            <span th:if="${hist.estado == 'ENTREGADO'}" class="badge-custom badge-entregado">
                                <i class="bi bi-check-circle-fill"></i> Entregado
                            </span>
                            <span th:if="${hist.estado == 'CANCELADO'}" class="badge-custom badge-cancelado">
                                <i class="bi bi-x-circle-fill"></i> Cancelado
                            </span>
                            <span th:if="${hist.estado == 'RECIBIDO'}" class="badge-custom badge-en-preparacion">
                                <i class="bi bi-box-arrow-in-right"></i> Recibido
                            </span>
                            <span th:if="${hist.estado == 'LISTO'}" class="badge-custom badge-en-camino">
                                <i class="bi bi-check-circle"></i> Listo
                            </span>
                        </td>
                        <td th:text="${hist.fechaHoraCambio}"></td>
                        <td th:text="${hist.usuarioCambio.empleado.nombres} + ' ' + ${hist.usuarioCambio.empleado.apellidos}"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="alert alert-info mt-3">
            <i class="bi bi-info-circle"></i>
            <strong>Nota:</strong> Este módulo muestra el historial de cambios de estado de los pedidos. 
            Los registros son creados automáticamente por el sistema.
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
