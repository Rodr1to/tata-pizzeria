<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>El Tata Pizza | Registrar Historial de Estado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-orange: #F15A22;
            --primary-hover: #D9480F;
            --cream-bg: #FFF8F3;
            --text-dark: #2B2B2B;
            --text-gray: #6B7280;
        }
        body {
            background-color: var(--cream-bg);
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .btn-primary-custom {
            background-color: var(--primary-orange);
            border-color: var(--primary-orange);
            color: white;
        }
        .btn-primary-custom:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            color: white;
        }
        .page-title {
            color: var(--primary-orange);
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h1 class="page-title">
            <i class="bi bi-plus-circle"></i> Registrar Historial de Estado
        </h1>
        <div class="mb-3"></div>
        
        <form th:action="@{/historial/registrar}" method="post" th:object="${historial}">
            
            <div class="row">
                <div class="col-6">
                    <label for="txtPedido" class="form-label">ID del Pedido:</label>
                    <input type="number" class="form-control" id="txtPedido" name="txtPedido"
                        placeholder="Ingresa el ID del pedido" required th:field="*{pedido.id}">
                </div>

                <div class="col-6">
                    <label for="txtEstado" class="form-label">Estado:</label>
                    <select class="form-select" id="txtEstado" th:field="*{estado}">
                        <option value="">Seleccione estado</option>
                        <option value="PENDIENTE">Pendiente</option>
                        <option value="EN_PREPARACION">En Preparación</option>
                        <option value="LISTO">Listo</option>
                        <option value="ENTREGADO">Entregado</option>
                        <option value="CANCELADO">Cancelado</option>
                    </select>
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-6">
                    <label for="txtFechaHora" class="form-label">Fecha y Hora:</label>
                    <input type="datetime-local" class="form-control" id="txtFechaHora" name="txtFechaHora"
                        required th:field="*{fechaHoraCambio}">
                </div>

                <div class="col-6">
                    <label for="txtUsuario" class="form-label">ID del Usuario que Cambió:</label>
                    <input type="number" class="form-control" id="txtUsuario" name="txtUsuario"
                        placeholder="Ingresa el ID del usuario" required th:field="*{usuarioCambio.id}">
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-12">
                    <button type="submit" class="btn btn-primary-custom">
                        <i class="bi bi-save"></i> Registrar
                    </button>
                    <a th:href="@{/historial/listar}" class="btn btn-dark">
                        <i class="bi bi-arrow-left"></i> Regresar
                    </a>
                </div>
            </div>

        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
