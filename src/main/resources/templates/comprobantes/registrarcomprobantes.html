<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>El Tata Pizza | Registrar Comprobante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-orange: #F15A22;
            --primary-hover: #D9480F;
            --cream-bg: #FFF8F3;
            --text-dark: #2B2B2B;
            --text-gray: #6B7280;
        }
        body {
            background-color: var(--cream-bg);
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .btn-primary-custom {
            background-color: var(--primary-orange);
            border-color: var(--primary-orange);
            color: white;
        }
        .btn-primary-custom:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            color: white;
        }
        .page-title {
            color: var(--primary-orange);
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h1 class="page-title">
            <i class="bi bi-plus-circle"></i> Registro de Comprobante de Pago
        </h1>
        <div class="mb-3"></div>
        
        <form th:action="@{/comprobantes/registrar}" method="post" th:object="${comprobante}">
            
            <div class="row">
                <div class="col-6">
                    <label for="txtPedido" class="form-label">ID del Pedido:</label>
                    <input type="number" class="form-control" id="txtPedido" name="txtPedido"
                        placeholder="Ingresa el ID del pedido" required th:field="*{pedido.id}">
                </div>

                <div class="col-6">
                    <label for="cboTipoComprobante" class="form-label">Tipo de Comprobante:</label>
                    <select class="form-select" id="cboTipoComprobante" th:field="*{tipoComprobante.id}">
                        <option value="">Seleccione tipo</option>
                        <option th:each="tipo : ${listartipos}" 
                                th:value="${tipo.id}" 
                                th:text="${tipo.nombre}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-4">
                    <label for="txtSerie" class="form-label">Serie:</label>
                    <input type="text" class="form-control" id="txtSerie" name="txtSerie"
                        placeholder="Ej: B001, F001" required th:field="*{serie}">
                </div>

                <div class="col-4">
                    <label for="txtNumeroCorrelativo" class="form-label">N° Correlativo:</label>
                    <input type="number" class="form-control" id="txtNumeroCorrelativo" name="txtNumeroCorrelativo"
                        placeholder="Ej: 0001" required th:field="*{numeroCorrelativo}">
                </div>

                <div class="col-4">
                    <label for="txtFechaEmision" class="form-label">Fecha de Emisión:</label>
                    <input type="datetime-local" class="form-control" id="txtFechaEmision" name="txtFechaEmision"
                        required th:field="*{fechaEmision}">
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-4">
                    <label for="txtMetodoPago" class="form-label">Método de Pago:</label>
                    <select class="form-select" id="txtMetodoPago" th:field="*{metodoPago}">
                        <option value="">Seleccione método</option>
                        <option value="EFECTIVO">Efectivo</option>
                        <option value="TARJETA_CREDITO">Tarjeta Crédito</option>
                        <option value="TARJETA_DEBITO">Tarjeta Débito</option>
                        <option value="YAPE">Yape</option>
                        <option value="PLIN">Plin</option>
                        <option value="TRANSFERENCIA">Transferencia</option>
                    </select>
                </div>

                <div class="col-4">
                    <label for="txtMontoPagado" class="form-label">Monto Pagado:</label>
                    <input type="number" step="0.01" class="form-control" id="txtMontoPagado" name="txtMontoPagado"
                        placeholder="Ingresa el monto pagado" required th:field="*{montoPagado}">
                </div>

                <div class="col-4">
                    <label for="txtVuelto" class="form-label">Vuelto:</label>
                    <input type="number" step="0.01" class="form-control" id="txtVuelto" name="txtVuelto"
                        placeholder="Ingresa el vuelto" required th:field="*{vuelto}">
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-6">
                    <label for="txtEstadoPago" class="form-label">Estado de Pago:</label>
                    <select class="form-select" id="txtEstadoPago" th:field="*{estadoPago}">
                        <option value="">Seleccione estado</option>
                        <option value="PAGADO">Pagado</option>
                        <option value="PENDIENTE">Pendiente</option>
                        <option value="ANULADO">Anulado</option>
                    </select>
                </div>

                <div class="col-6">
                    <label for="chkEst" class="form-label">Estado:</label>
                    <div class="form-check mt-2">
                        <input type="checkbox" class="form-check-input" id="chkEst" 
                               th:field="*{estado}">
                        <label class="form-check-label" for="chkEst">
                            Activo
                        </label>
                    </div>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-12">
                    <button type="submit" class="btn btn-primary-custom">
                        <i class="bi bi-save"></i> Registrar
                    </button>
                    <a th:href="@{/comprobantes/listar}" class="btn btn-dark">
                        <i class="bi bi-arrow-left"></i> Regresar
                    </a>
                </div>
            </div>

        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
