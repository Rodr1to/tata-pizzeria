<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>El Tata Pizza | Habilitar Repartidores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-orange: #F15A22;
            --primary-hover: #D9480F;
            --cream-bg: #FFF8F3;
            --text-dark: #2B2B2B;
            --text-gray: #6B7280;
        }
        body {
            background-color: var(--cream-bg);
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .btn-primary-custom {
            background-color: var(--primary-orange);
            border-color: var(--primary-orange);
            color: white;
        }
        .btn-primary-custom:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            color: white;
        }
        .page-title {
            color: var(--primary-orange);
            font-weight: 700;
        }
        .btn-warning-custom {
            background-color: #f0ad4e;
            border-color: #f0ad4e;
            color: white;
        }
        .btn-warning-custom:hover {
            background-color: #ec971f;
            border-color: #ec971f;
            color: white;
        }
        .btn-danger-custom {
            background-color: #dc3545;
            border-color: #dc3545;
            color: white;
        }
        .btn-danger-custom:hover {
            background-color: #c82333;
            border-color: #c82333;
            color: white;
        }
        .table-dark-custom {
            background-color: var(--primary-orange);
            color: white;
        }
        .estado-habilitado {
            color: #28a745;
            font-weight: 600;
        }
        .estado-deshabilitado {
            color: #dc3545;
            font-weight: 600;
        }
        .badge-disponible {
            background-color: #28a745;
            color: white;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
        }
        .badge-ocupado {
            background-color: #dc3545;
            color: white;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
        }
        .badge-descanso {
            background-color: #f0ad4e;
            color: white;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h1 class="page-title">
            <i class="bi bi-arrow-repeat"></i> Habilitar/Deshabilitar Repartidores
        </h1>
        <a th:href="@{/repartidores/listar}" class="btn btn-dark">
            <i class="bi bi-arrow-left"></i> Regresar
        </a>
        <div class="mb-3"></div>

        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered">
                <thead class="table-dark-custom">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nombre Completo</th>
                        <th scope="col">DNI</th>
                        <th scope="col">Teléfono</th>
                        <th scope="col">Sede</th>
                        <th scope="col">Disponibilidad</th>
                        <th scope="col">Estado</th>
                        <th scope="col">Habilitar</th>
                        <th scope="col">Deshabilitar</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="rep : ${listarrepartidores}">
                        <th scope="row" th:text="${rep.id}"></th>
                        <td th:text="${rep.nombreCompleto}"></td>
                        <td th:text="${rep.dni}"></td>
                        <td th:text="${rep.telefono}"></td>
                        <td th:text="${rep.sede.nombre}"></td>
                        <td>
                            <span th:if="${rep.estadoDisponibilidad == 'DISPONIBLE'}" class="badge-disponible">
                                <i class="bi bi-check-circle-fill"></i> Disponible
                            </span>
                            <span th:if="${rep.estadoDisponibilidad == 'OCUPADO'}" class="badge-ocupado">
                                <i class="bi bi-clock-fill"></i> Ocupado
                            </span>
                            <span th:if="${rep.estadoDisponibilidad == 'DESCANSO'}" class="badge-descanso">
                                <i class="bi bi-pause-circle-fill"></i> Descanso
                            </span>
                        </td>
                        <td>
                            <span th:if="${rep.estado}" class="estado-habilitado">
                                <i class="bi bi-check-circle-fill"></i> Activo
                            </span>
                            <span th:unless="${rep.estado}" class="estado-deshabilitado">
                                <i class="bi bi-x-circle-fill"></i> Inactivo
                            </span>
                        </td>
                        <td>
                            <a th:href="@{/repartidores/habilitar/{id}(id=${rep.id})}" 
                               class="btn btn-warning-custom"
                               th:classappend="${rep.estado} ? 'disabled' : ''">
                                <i class="bi bi-check-circle"></i> Habilitar
                            </a>
                        </td>
                        <td>
                            <a th:href="@{/repartidores/deshabilitar/{id}(id=${rep.id})}" 
                               class="btn btn-danger-custom"
                               th:classappend="${!rep.estado} ? 'disabled' : ''">
                                <i class="bi bi-x-circle"></i> Deshabilitar
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
