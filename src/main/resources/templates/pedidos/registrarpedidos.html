<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>El Tata Pizza | Registrar Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-orange: #F15A22;
            --primary-hover: #D9480F;
            --cream-bg: #FFF8F3;
            --text-dark: #2B2B2B;
            --text-gray: #6B7280;
        }
        body {
            background-color: var(--cream-bg);
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .btn-primary-custom {
            background-color: var(--primary-orange);
            border-color: var(--primary-orange);
            color: white;
        }
        .btn-primary-custom:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            color: white;
        }
        .page-title {
            color: var(--primary-orange);
            font-weight: 700;
        }
        .info-box {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
        }
        .info-box .label {
            color: var(--text-gray);
            font-size: 0.9rem;
        }
        .info-box .value {
            font-weight: 700;
            font-size: 1.1rem;
        }
        .info-box .value.total {
            color: var(--primary-orange);
            font-size: 1.3rem;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h1 class="page-title">
            <i class="bi bi-plus-circle"></i> Nuevo Pedido
        </h1>
        <div class="mb-3"></div>
        
        <form th:action="@{/pedidos/registrar}" method="post" th:object="${pedido}">
            
            <div class="row">
                <div class="col-4">
                    <label for="cboCliente" class="form-label">Cliente:</label>
                    <select class="form-select" id="cboCliente" th:field="*{cliente.id}" required>
                        <option value="">Seleccione cliente</option>
                        <option th:each="cli : ${listarclientes}" 
                                th:value="${cli.id}" 
                                th:text="${cli.nombres} + ' ' + ${cli.apellidos} + ' - ' + ${cli.telefonoWhatsapp}">
                        </option>
                    </select>
                </div>

                <div class="col-4">
                    <label for="cboSede" class="form-label">Sede:</label>
                    <select class="form-select" id="cboSede" th:field="*{sede.id}" required>
                        <option value="">Seleccione sede</option>
                        <option th:each="sed : ${listarsedes}" 
                                th:value="${sed.id}" 
                                th:text="${sed.nombre}">
                        </option>
                    </select>
                </div>

                <div class="col-4">
                    <label for="cboUsuario" class="form-label">Usuario:</label>
                    <select class="form-select" id="cboUsuario" th:field="*{usuario.id}" required>
                        <option value="">Seleccione usuario</option>
                        <option th:each="usu : ${listarusuarios}" 
                                th:value="${usu.id}" 
                                th:text="${usu.empleado.nombres} + ' ' + ${usu.empleado.apellidos} + ' - ' + ${usu.rol}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-4">
                    <label for="txtFechaHoraPedido" class="form-label">Fecha y Hora:</label>
                    <input type="datetime-local" class="form-control" id="txtFechaHoraPedido" name="fechaHoraPedido"
                    th:field="*{fechaHoraPedido}" 
                    required>
                </div>

                <div class="col-4">
                    <label for="txtTipoEntrega" class="form-label">Tipo de Entrega:</label>
                    <select class="form-select" id="txtTipoEntrega" th:field="*{tipoEntrega}" required>
                        <option value="">Seleccione tipo</option>
                        <option value="DELIVERY">Delivery</option>
                        <option value="RECOJO">Recojo en tienda</option>
                        <option value="SALON">Consumo en salón</option>
                    </select>
                </div>

                <div class="col-4">
                    <label for="txtOrigenPedido" class="form-label">Origen del Pedido:</label>
                    <select class="form-select" id="txtOrigenPedido" th:field="*{origenPedido}" required>
                        <option value="">Seleccione origen</option>
                        <option value="WEB">Web</option>
                        <option value="APP">App Móvil</option>
                        <option value="TELEFONO">Teléfono</option>
                        <option value="SALON">Salón</option>
                        <option value="DELIVERY">Delivery</option>
                    </select>
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-12">
                    <label for="txtObservaciones" class="form-label">Observaciones:</label>
                    <textarea class="form-control" id="txtObservaciones" rows="2" 
                              placeholder="Ingresa observaciones adicionales (opcional)" th:field="*{observaciones}"></textarea>
                </div>
            </div>

            <!-- 🔥 Sección de montos (calculados automáticamente) -->
            <div class="row mt-3">
                <div class="col-12">
                    <div class="info-box">
                        <div class="row">
                            <div class="col-md-4 text-center">
                                <div class="label">Subtotal</div>
                                <div class="value" id="subtotalDisplay">S/ 0.00</div>
                            </div>
                            <div class="col-md-4 text-center">
                                <div class="label">Costo Delivery</div>
                                <div class="value" id="deliveryDisplay">S/ 0.00</div>
                            </div>
                            <div class="col-md-4 text-center">
                                <div class="label">Total</div>
                                <div class="value total" id="totalDisplay">S/ 0.00</div>
                            </div>
                        </div>
                        <div class="text-center mt-2">
                            <small class="text-muted">
                                <i class="bi bi-info-circle"></i> Los montos se calcularán automáticamente al agregar productos
                            </small>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 🔥 Campos ocultos para enviar los valores al backend -->
            <input type="hidden" th:field="*{montoSubtotal}" id="montoSubtotal" />
            <input type="hidden" th:field="*{costoDelivery}" id="costoDelivery" />
            <input type="hidden" th:field="*{montoTotal}" id="montoTotal" />

            <div class="row mt-3">
                <div class="col-6">
                    <label for="chkEst" class="form-label">Estado:</label>
                    <div class="form-check mt-2">
                        <input type="checkbox" class="form-check-input" id="chkEst" 
                               th:field="*{estado}">
                        <label class="form-check-label" for="chkEst">
                            Activo
                        </label>
                    </div>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-12">
                    <button type="submit" class="btn btn-primary-custom">
                        <i class="bi bi-save"></i> Crear Pedido
                    </button>
                    <a th:href="@{/pedidos/listar}" class="btn btn-dark">
                        <i class="bi bi-arrow-left"></i> Cancelar
                    </a>
                </div>
            </div>

        </form>
    </div>
    
    <script>
        // Inicializar valores por defecto
        document.addEventListener('DOMContentLoaded', function() {
            // Si hay valores precargados, mostrarlos
            const subtotal = parseFloat(document.getElementById('montoSubtotal').value) || 0;
            const delivery = parseFloat(document.getElementById('costoDelivery').value) || 0;
            const total = parseFloat(document.getElementById('montoTotal').value) || 0;
            
            document.getElementById('subtotalDisplay').textContent = 'S/ ' + subtotal.toFixed(2);
            document.getElementById('deliveryDisplay').textContent = 'S/ ' + delivery.toFixed(2);
            document.getElementById('totalDisplay').textContent = 'S/ ' + total.toFixed(2);
        });
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
