<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>El Tata Pizza | Listar Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-orange: #F15A22;
            --primary-hover: #D9480F;
            --cream-bg: #FFF8F3;
            --text-dark: #2B2B2B;
            --text-gray: #6B7280;
        }
        body {
            background-color: var(--cream-bg);
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .btn-primary-custom {
            background-color: var(--primary-orange);
            border-color: var(--primary-orange);
            color: white;
        }
        .btn-primary-custom:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            color: white;
        }
        .table-dark-custom {
            background-color: var(--primary-orange);
            color: white;
        }
        .page-title {
            color: var(--primary-orange);
            font-weight: 700;
        }
        .btn-warning-custom {
            background-color: #f0ad4e;
            border-color: #f0ad4e;
            color: white;
        }
        .btn-warning-custom:hover {
            background-color: #ec971f;
            border-color: #ec971f;
            color: white;
        }
        .estado-habilitado {
            color: #28a745;
            font-weight: 600;
        }
        .estado-deshabilitado {
            color: #dc3545;
            font-weight: 600;
        }
        .badge-entrega {
            background-color: var(--primary-orange);
            color: white;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
        }
        .badge-origen {
            background-color: #5bc0de;
            color: white;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h1 class="page-title">
            <i class="bi bi-cart"></i> Listado de Pedidos
        </h1>
        <div class="mb-3">
            <a th:href="@{/pedidos/registro}" class="btn btn-primary-custom">
                <i class="bi bi-plus-circle"></i> Registrar Pedido
            </a>
            <a th:href="@{/pedidos/habilita}" class="btn btn-warning-custom">
                <i class="bi bi-arrow-repeat"></i> Habilitar Pedido
            </a>
            <a th:href="@{/menuprincipal}" class="btn btn-dark">
                <i class="bi bi-arrow-left"></i> Regresar
            </a>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered">
                <thead class="table-dark-custom">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Cliente</th>
                        <th scope="col">Sede</th>
                        <th scope="col">Usuario</th>
                        <th scope="col">Fecha/Hora</th>
                        <th scope="col">Tipo Entrega</th>
                        <th scope="col">Origen</th>
                        <th scope="col">Subtotal</th>
                        <th scope="col">Delivery</th>
                        <th scope="col">Total</th>
                        <th scope="col">Estado</th>
                        <th scope="col">Detalles</th>
                        <th scope="col">Deshabilitar</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ped : ${listarpedidos}">
                        <th scope="row" th:text="${ped.id}"></th>
                        <td th:text="${ped.cliente.nombres} + ' ' + ${ped.cliente.apellidos}"></td>
                        <td th:text="${ped.sede.nombre}"></td>
                        <td th:text="${ped.usuario.empleado.nombres} + ' ' + ${ped.usuario.empleado.apellidos}"></td>
                        <td th:text="${ped.fechaHoraPedido}"></td>
                        <td>
                            <span class="badge-entrega" th:text="${ped.tipoEntrega}"></span>
                        </td>
                        <td>
                            <span class="badge-origen" th:text="${ped.origenPedido}"></span>
                        </td>
                        <td th:text="'S/ ' + ${ped.montoSubtotal}"></td>
                        <td th:text="'S/ ' + ${ped.costoDelivery}"></td>
                        <td th:text="'S/ ' + ${ped.montoTotal}"></td>
                        <td>
                            <span th:if="${ped.estado}" class="estado-habilitado">
                                <i class="bi bi-check-circle-fill"></i> Activo
                            </span>
                            <span th:unless="${ped.estado}" class="estado-deshabilitado">
                                <i class="bi bi-x-circle-fill"></i> Inactivo
                            </span>
                        </td>

                        <td>
                            <a th:href="@{/pedidos/detalles/{id}(id=${ped.id})}" 
                            class="btn btn-info btn-sm">
                                <i class="bi bi-list-ul"></i> Ver Detalle
                            </a>
                        </td>

                        <td>
                            <a th:href="@{/pedidos/eliminar/{id}(id=${ped.id})}" 
                               class="btn btn-danger btn-sm"
                               th:classappend="${!ped.estado} ? 'disabled' : ''"
                               onclick="return confirm('¿Estás seguro de deshabilitar este pedido?')">
                                <i class="bi bi-trash"></i> Deshabilitar
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
