<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Tata Pizza - Sistema de Gestión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --primary-orange: #F15A22;
            --primary-hover: #D9480F;
            --cream-bg: #FFF8F3;
            --text-dark: #2B2B2B;
            --text-gray: #6B7280;
        }

        body {
            background-color: var(--cream-bg);
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar-custom {
            background-color: var(--primary-orange);
            padding: 15px 0;
        }

        .navbar-custom .navbar-brand {
            color: white;
            font-weight: 700;
            font-size: 1.8rem;
        }

        .navbar-custom .navbar-brand i {
            margin-right: 10px;
        }

        .login-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 0;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 50px 35px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            max-width: 450px;
            width: 100%;
            border: 1px solid rgba(241, 90, 34, 0.1);
            text-align: center;
        }

        .logo-icon {
            width: 90px;
            height: 90px;
            background: var(--cream-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .logo-icon i {
            font-size: 3.5rem;
            color: var(--primary-orange);
        }

        .login-card h3 {
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-gray);
            margin-bottom: 30px;
        }

        .btn-primary-custom {
            background-color: var(--primary-orange);
            border: none;
            color: white;
            font-weight: 600;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary-custom:hover {
            background-color: var(--primary-hover);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(241, 90, 34, 0.3);
        }

        .footer-custom {
            background-color: var(--text-dark);
            color: rgba(255,255,255,0.8);
            padding: 20px 0;
            margin-top: auto;
        }

        @media (max-width: 480px) {
            .login-card {
                margin: 0 15px;
                padding: 35px 25px;
            }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-pizza"></i> El Tata Pizza
        </a>
    </div>
</nav>

<!-- Contenido Principal -->
<section class="login-section">
    <div class="login-card">

        <div class="logo-icon">
            <i class="bi bi-pizza"></i>
        </div>

        <h3>Sistema de Gestión</h3>

        <p class="subtitle">
            Bienvenido al sistema administrativo de El Tata Pizza.
        </p>

        <a href="/tatapizzeria/menuprincipal"
           class="btn btn-primary-custom">
            <i class="bi bi-box-arrow-in-right"></i>
            Ingresar al Sistema de Gestión
        </a>

    </div>
</section>

<!-- Footer -->
<footer class="footer-custom">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-6">
                <p class="mb-0">
                    <i class="bi bi-pizza"></i>
                    El Tata Pizza - Sistema de Gestión
                </p>
            </div>
            <div class="col-md-6 text-md-end">
                <span>© 2026 Todos los derechos reservados</span>
            </div>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
