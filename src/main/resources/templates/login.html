<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Tata Pizza - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-orange: #F15A22;
            --primary-hover: #D9480F;
            --cream-bg: #FFF8F3;
            --text-dark: #2B2B2B;
            --text-gray: #6B7280;
        }

        body {
            background-color: var(--cream-bg);
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar-custom {
            background-color: var(--primary-orange);
            padding: 15px 0;
        }

        .navbar-custom .navbar-brand {
            color: white;
            font-weight: 700;
            font-size: 1.8rem;
        }

        .navbar-custom .navbar-brand i {
            margin-right: 10px;
        }

        .login-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 0;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(241, 90, 34, 0.1);
        }

        .login-card .logo-icon {
            width: 80px;
            height: 80px;
            background: var(--cream-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .login-card .logo-icon i {
            font-size: 3rem;
            color: var(--primary-orange);
        }

        .login-card h3 {
            font-weight: 700;
            color: var(--text-dark);
            text-align: center;
        }

        .login-card .subtitle {
            color: var(--text-gray);
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .login-card .form-label {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.9rem;
        }

        .login-card .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e5e7eb;
            transition: all 0.3s ease;
        }

        .login-card .form-control:focus {
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 0.2rem rgba(241, 90, 34, 0.25);
        }

        .login-card .input-group-text {
            background: transparent;
            border: 2px solid #e5e7eb;
            border-right: none;
            border-radius: 10px 0 0 10px;
            color: var(--text-gray);
        }

        .login-card .input-group .form-control {
            border-radius: 0 10px 10px 0;
            border-left: none;
        }

        .login-card .input-group .form-control:focus {
            border-left: none;
        }

        .btn-primary-custom {
            background-color: var(--primary-orange);
            border-color: var(--primary-orange);
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 10px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            font-size: 1rem;
        }

        .btn-primary-custom:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(241, 90, 34, 0.3);
        }

        .login-card .credentials-info {
            background: var(--cream-bg);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            border: 1px dashed var(--primary-orange);
        }

        .login-card .credentials-info small {
            color: var(--text-gray);
            font-size: 0.8rem;
        }

        .login-card .credentials-info .badge-cred {
            background: var(--primary-orange);
            color: white;
            padding: 2px 10px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .login-card .credentials-info .cred-value {
            font-weight: 600;
            color: var(--text-dark);
            font-family: 'Courier New', monospace;
        }

        .footer-custom {
            background-color: var(--text-dark);
            color: rgba(255,255,255,0.8);
            padding: 20px 0;
            margin-top: auto;
        }

        .footer-custom a {
            color: var(--primary-orange);
            text-decoration: none;
        }

        .footer-custom a:hover {
            color: white;
        }

        /* Animación de error */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.5s ease;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
                margin: 0 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-pizza"></i> El Tata Pizza
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/}">
                            <i class="bi bi-house-door"></i> Inicio
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="login-section">
        <div class="login-card">
            <!-- Logo -->
            <div class="logo-icon">
                <i class="bi bi-person-circle"></i>
            </div>

            <h3>Bienvenido</h3>
            <p class="subtitle">Ingresa tus credenciales para acceder al sistema</p>

            <!-- Formulario de Login -->
            <form id="loginForm" onsubmit="return validarLogin(event)">
                <div class="mb-3">
                    <label for="txtUsuario" class="form-label">
                        <i class="bi bi-person"></i> Usuario
                    </label>
                    <input type="text" class="form-control" id="txtUsuario" 
                           placeholder="Ingresa tu usuario" 
                           value="admin" required>
                </div>

                <div class="mb-3">
                    <label for="txtPassword" class="form-label">
                        <i class="bi bi-lock"></i> Contraseña
                    </label>
                    <input type="password" class="form-control" id="txtPassword" 
                           placeholder="Ingresa tu contraseña" 
                           value="123456" required>
                </div>

                <div id="errorMessage" class="alert alert-danger d-none" role="alert">
                    <i class="bi bi-exclamation-triangle"></i> Usuario o contraseña incorrectos
                </div>

                <button type="submit" class="btn btn-primary-custom">
                    <i class="bi bi-box-arrow-in-right"></i> Ingresar
                </button>
            </form>

           
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer-custom">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <p class="mb-0">
                        <i class="bi bi-pizza"></i> El Tata Pizza - Sistema de Gestión
                    </p>
                </div>
                <div class="col-md-6 text-md-end">
                    <span class="text-muted">© 2026 Todos los derechos reservados</span>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        // Credenciales válidas
        const USUARIO_VALIDO = 'admin';
        const CONTRASENA_VALIDA = '123456';

        function validarLogin(event) {
            event.preventDefault();

            const usuario = document.getElementById('txtUsuario').value.trim();
            const password = document.getElementById('txtPassword').value.trim();
            const errorDiv = document.getElementById('errorMessage');

            // Limpiar errores anteriores
            errorDiv.classList.add('d-none');
            document.getElementById('txtUsuario').classList.remove('is-invalid', 'shake');
            document.getElementById('txtPassword').classList.remove('is-invalid', 'shake');

            // Validar credenciales
            if (usuario === USUARIO_VALIDO && password === CONTRASENA_VALIDA) {
                // 🔥 Credenciales correctas → Redirigir al menú principal
                window.location.href = '/tatapizzeria/menuprincipal';
            } else {
                // Mostrar error
                errorDiv.classList.remove('d-none');
                document.getElementById('txtUsuario').classList.add('is-invalid', 'shake');
                document.getElementById('txtPassword').classList.add('is-invalid', 'shake');

                // Limpiar campos después de 2 segundos
                setTimeout(() => {
                    document.getElementById('txtUsuario').classList.remove('is-invalid', 'shake');
                    document.getElementById('txtPassword').classList.remove('is-invalid', 'shake');
                }, 2000);

                // Limpiar contraseña
                document.getElementById('txtPassword').value = '';
                document.getElementById('txtPassword').focus();
            }
        }

        // Permitir presionar Enter para enviar
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('txtPassword').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('loginForm').dispatchEvent(new Event('submit'));
                }
            });
            document.getElementById('txtUsuario').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('loginForm').dispatchEvent(new Event('submit'));
                }
            });
        });
    </script>
</body>
</html>
