<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>El Tata Pizza | Listar Variantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-orange: #F15A22;
            --primary-hover: #D9480F;
            --cream-bg: #FFF8F3;
            --text-dark: #2B2B2B;
            --text-gray: #6B7280;
        }
        body {
            background-color: var(--cream-bg);
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .btn-primary-custom {
            background-color: var(--primary-orange);
            border-color: var(--primary-orange);
            color: white;
        }
        .btn-primary-custom:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            color: white;
        }
        .table-dark-custom {
            background-color: var(--primary-orange);
            color: white;
        }
        .page-title {
            color: var(--primary-orange);
            font-weight: 700;
        }
        .btn-warning-custom {
            background-color: #f0ad4e;
            border-color: #f0ad4e;
            color: white;
        }
        .btn-warning-custom:hover {
            background-color: #ec971f;
            border-color: #ec971f;
            color: white;
        }
        .estado-habilitado {
            color: #28a745;
            font-weight: 600;
        }
        .estado-deshabilitado {
            color: #dc3545;
            font-weight: 600;
        }
        .badge-stock-bajo {
            background-color: #dc3545;
            color: white;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
        }
        .badge-stock-medio {
            background-color: #f0ad4e;
            color: white;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
        }
        .badge-stock-alto {
            background-color: #28a745;
            color: white;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h1 class="page-title">
            <i class="bi bi-sliders"></i> Listado de Variantes de Precios
        </h1>
        <div class="mb-3">
            <a th:href="@{/variantes/registro}" class="btn btn-primary-custom">
                <i class="bi bi-plus-circle"></i> Registrar Variante
            </a>
            <a th:href="@{/variantes/habilita}" class="btn btn-warning-custom">
                <i class="bi bi-arrow-repeat"></i> Habilitar Variante
            </a>
            <a th:href="@{/menuprincipal}" class="btn btn-dark">
                <i class="bi bi-arrow-left"></i> Regresar
            </a>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered">
                <thead class="table-dark-custom">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Producto</th>
                        <th scope="col">Tamaño</th>
                        <th scope="col">Precio Base</th>
                        <th scope="col">Stock</th>
                        <th scope="col">Nivel Stock</th>
                        <th scope="col">Estado</th>
                        <th scope="col">Actualizar</th>
                        <th scope="col">Deshabilitar</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="var : ${listarvariantes}">
                        <th scope="row" th:text="${var.id}"></th>
                        <td th:text="${var.producto.nombre}"></td>
                        <td th:text="${var.tamano.nombre}"></td>
                        <td th:text="'S/ ' + ${var.precioBase}"></td>
                        <td th:text="${var.stockDisponible}"></td>
                        <td>
                            <span th:if="${var.stockDisponible <= 0}" class="badge-stock-bajo">
                                <i class="bi bi-exclamation-circle-fill"></i> Sin stock
                            </span>
                            <span th:if="${var.stockDisponible > 0 and var.stockDisponible <= 5}" class="badge-stock-bajo">
                                <i class="bi bi-exclamation-triangle-fill"></i> Stock bajo
                            </span>
                            <span th:if="${var.stockDisponible > 5 and var.stockDisponible <= 15}" class="badge-stock-medio">
                                <i class="bi bi-dash-circle-fill"></i> Stock medio
                            </span>
                            <span th:if="${var.stockDisponible > 15}" class="badge-stock-alto">
                                <i class="bi bi-check-circle-fill"></i> Stock alto
                            </span>
                        </td>
                        <td>
                            <span th:if="${var.estado}" class="estado-habilitado">
                                <i class="bi bi-check-circle-fill"></i> Activo
                            </span>
                            <span th:unless="${var.estado}" class="estado-deshabilitado">
                                <i class="bi bi-x-circle-fill"></i> Inactivo
                            </span>
                        </td>
                        <td>
                            <a th:href="@{/variantes/actualiza/{id}(id=${var.id})}" class="btn btn-success btn-sm">
                                <i class="bi bi-pencil"></i> Editar
                            </a>
                        </td>
                        <td>
                            <a th:href="@{/variantes/eliminar/{id}(id=${var.id})}" 
                               class="btn btn-danger btn-sm"
                               th:classappend="${!var.estado} ? 'disabled' : ''"
                               onclick="return confirm('¿Estás seguro de deshabilitar esta variante?')">
                                <i class="bi bi-trash"></i> Deshabilitar
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
