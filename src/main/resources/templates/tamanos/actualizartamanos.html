<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>El Tata Pizza | Actualizar Tamaño</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-orange: #F15A22;
            --primary-hover: #D9480F;
            --cream-bg: #FFF8F3;
            --text-dark: #2B2B2B;
            --text-gray: #6B7280;
        }
        body {
            background-color: var(--cream-bg);
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .btn-success-custom {
            background-color: #28a745;
            border-color: #28a745;
            color: white;
        }
        .btn-success-custom:hover {
            background-color: #218838;
            border-color: #218838;
            color: white;
        }
        .page-title {
            color: var(--primary-orange);
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="container py-4">
        <h1 class="page-title">
            <i class="bi bi-pencil-square"></i> Actualización de Tamaño
        </h1>
        <div class="mb-3"></div>
        
        <form th:action="@{/tamanos/actualizar/{id}(id=*{id})}" method="post" th:object="${tamanos}">
            
            <div class="row">
                <div class="col-2">
                    <label for="txtCod" class="form-label">ID:</label>
                    <input type="text" class="form-control" id="txtCod" name="txtCod"
                        readonly th:field="*{id}">
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-6">
                    <label for="txtNombre" class="form-label">Nombre:</label>
                    <input type="text" class="form-control" id="txtNombre" name="txtNombre"
                        placeholder="Ej: Pequeño, Mediano, Grande, Familiar" required th:field="*{nombre}">
                </div>

                <div class="col-6">
                    <label for="txtPorcionesEstimadas" class="form-label">Porciones Estimadas:</label>
                    <input type="number" class="form-control" id="txtPorcionesEstimadas" name="txtPorcionesEstimadas"
                        placeholder="Ej: 4, 6, 8, 12" required th:field="*{porcionesEstimadas}">
                </div>
            </div>

            <div class="row mt-3">
                <div class="col-6">
                    <label for="chkEst" class="form-label">Estado:</label>
                    <div class="form-check mt-2">
                        <input type="checkbox" class="form-check-input" id="chkEst" 
                               th:field="*{estado}">
                        <label class="form-check-label" for="chkEst">
                            Activo
                        </label>
                    </div>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-12">
                    <button type="submit" class="btn btn-success-custom">
                        <i class="bi bi-save"></i> Actualizar
                    </button>
                    <a th:href="@{/tamanos/listar}" class="btn btn-dark">
                        <i class="bi bi-arrow-left"></i> Regresar
                    </a>
                </div>
            </div>

        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
